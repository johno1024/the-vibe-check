name: Integrate Sharing UX 2
on:
  push:
    branches: [qa-sharing-invite-2]
    paths: ['share-ux-2.js', '.github/workflows/integrate-sharing-ux-2.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-sharing-invite-2
      - name: Load sharing enhancement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); tag='<script src="./share-ux-2.js"></script>'
          if tag not in s:
              assert '</body></html>' in s
              s=s.replace('</body></html>',tag+'</body></html>',1); p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'share-ux-2.js' index.html
          test -s share-ux-2.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Load Sharing & Invitation UX 2.0'
          git push origin HEAD:qa-sharing-invite-2